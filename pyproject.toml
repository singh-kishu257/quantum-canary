[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-canary"
dynamic = ["version"]
description = "Qubit health checks: T1, T2, T2*, frequency offset and single-qubit gate error on IBM hardware, gate error on IonQ, with uncertainties, a model check and drift detection."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kanishka Singh" }]
requires-python = ">=3.10"
keywords = ["quantum computing", "qubit characterization", "T1", "T2", "Ramsey",
            "randomized benchmarking", "drift detection", "Qiskit", "IBM Quantum",
            "IonQ", "NISQ"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Physics",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "qiskit>=2.0",
    "qiskit-aer>=0.17",
    "qiskit-ionq>=1.0",
    "requests>=2.31",
    "qiskit-ibm-runtime>=0.40",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
quantum-canary = "quantum_canary.cli:main"

[project.urls]
Repository = "https://github.com/singh-kishu257/quantum-canary"
Issues = "https://github.com/singh-kishu257/quantum-canary/issues"

[tool.setuptools.dynamic]
version = { attr = "quantum_canary.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quantum_canary = ["py.typed"]
