[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-canary"
version = "0.1.0"
description = "Real-time noise drift detection for NISQ-era quantum processors"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Kanishka Singh"}
]
requires-python = ">=3.10"
keywords = [
    "quantum-computing",
    "quantum-noise",
    "drift-detection",
    "nisq",
    "qiskit",
    "ibm-quantum",
    "machine-learning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "tensorflow>=2.15",
    "qiskit>=1.0",
    "qiskit-ibm-runtime>=0.20",
    "matplotlib>=3.7",
]

[project.scripts]
quantum-canary = "quantum_canary.cli:main"

[project.urls]
Homepage   = "https://github.com/singh-kishu257/quantum-canary"
Repository = "https://github.com/singh-kishu257/quantum-canary"
Issues     = "https://github.com/singh-kishu257/quantum-canary/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quantum_canary = ["_data/*.keras", "_data/*.json"]