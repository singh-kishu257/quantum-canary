[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "quantum-canary"
version = "0.1.0"
description = "Online ion-health learning and qubit-to-ion assignment for trapped-ion quantum computers."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Kanishka" }]
keywords = ["quantum computing", "trapped ions", "IonQ", "qubit mapping", "error mitigation", "benchmarking"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "qiskit>=1.2",
    "qiskit-ionq>=1.0",
]

[project.optional-dependencies]
aer = ["qiskit-aer>=0.15"]
test = ["pytest>=7", "qiskit-aer>=0.15"]

[tool.hatch.build.targets.wheel]
packages = ["src/quantum_canary"]

[tool.hatch.build.targets.sdist]
include = ["src/quantum_canary", "tests", "README.md", "LICENSE", "CITATION.cff", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
