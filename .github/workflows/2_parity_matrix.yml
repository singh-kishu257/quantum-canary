name: Parity Experiments (Fig 2 & 3)

on:
  workflow_dispatch:
    inputs:
      n_instances:
        description: "Instances per architecture (default 300)"
        required: false
        default: "300"

jobs:
  parity:
    name: "${{ matrix.arch }}"
    runs-on: ubuntu-latest
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        arch:
          - superconducting
          - trapped_ion
          - neutral_atom

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install numpy scipy matplotlib qiskit qiskit-aer

      - name: Run parity experiment
        env:
          ARCH: ${{ matrix.arch }}
          N_INSTANCES: ${{ github.event.inputs.n_instances || '300' }}
          N_WORKERS: "2"
        run: |
          cd research
          python 2_parity_experiments.py

      - name: Upload arch results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parity-${{ matrix.arch }}
          path: |
            research/data/parity_results.csv
            research/data/mismatch_results.csv
          retention-days: 7

  merge:
    name: "Merge + Figures"
    runs-on: ubuntu-latest
    needs: parity
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install numpy scipy matplotlib qiskit qiskit-aer

      - name: Download all arch artifacts
        uses: actions/download-artifact@v4
        with:
          path: parity-artifacts

      - name: Merge CSVs and generate figures
        run: |
          python - << 'EOF'
          import csv, pathlib, sys, importlib.util
          import numpy as np
          import matplotlib.pyplot as plt
          import matplotlib.gridspec as gridspec

          artifact_root = pathlib.Path("parity-artifacts")
          data_dir      = pathlib.Path("research/data")
          fig_dir       = pathlib.Path("research/figures")
          data_dir.mkdir(exist_ok=True)
          fig_dir.mkdir(exist_ok=True)

          def merge_csv(filename, out_path):
              rows = []
              fieldnames = None
              for arch_dir in sorted(artifact_root.iterdir()):
                  src = arch_dir / filename
                  if not src.exists():
                      print(f"WARNING: {src} not found, skipping")
                      continue
                  with open(src, newline="", encoding="utf-8") as f:
                      reader = csv.DictReader(f)
                      if fieldnames is None:
                          fieldnames = reader.fieldnames
                      rows.extend(list(reader))
              if not rows:
                  raise RuntimeError(f"No data found for {filename}")
              with open(out_path, "w", newline="", encoding="utf-8") as f:
                  w = csv.DictWriter(f, fieldnames=fieldnames)
                  w.writeheader()
                  w.writerows(rows)
              print(f"Merged {len(rows)} rows -> {out_path}")
              return rows, fieldnames

          parity_rows,  _ = merge_csv("parity_results.csv",   data_dir / "parity_results_combined.csv")
          mismatch_rows, _ = merge_csv("mismatch_results.csv", data_dir / "mismatch_results_combined.csv")

          _spec = importlib.util.spec_from_file_location(
              "inversion", pathlib.Path("research/1_inversion.py"))
          inv = importlib.util.module_from_spec(_spec)
          sys.modules["inversion"] = inv
          _spec.loader.exec_module(inv)

          ARCHITECTURES = ["superconducting", "trapped_ion", "neutral_atom"]
          COLORS  = {"superconducting": "#1f77b4", "trapped_ion": "#ff7f0e", "neutral_atom": "#2ca02c"}
          MARKERS = {"superconducting": "o", "trapped_ion": "s", "neutral_atom": "^"}
          LABELS  = {"superconducting": "Superconducting", "trapped_ion": "Trapped ion", "neutral_atom": "Neutral atom"}

          def to_arrays(rows):
              rec = {}
              for k in rows[0].keys():
                  try:
                      rec[k] = np.array([float(r[k]) for r in rows])
                  except (ValueError, TypeError):
                      rec[k] = np.array([r[k] for r in rows])
              return rec

          def compute_metrics(t, r):
              ss_res = np.sum((r - t) ** 2)
              ss_tot = np.sum((t - t.mean()) ** 2)
              r2   = float(1.0 - ss_res / ss_tot) if ss_tot > 0 else 0.0
              rmse = float(np.sqrt(np.mean((r - t) ** 2)))
              return r2, rmse

          def make_figure(rec, title, out_stem):
              arch_arr = rec["arch"]
              panels = [
                  (rec["T1_true"],  rec["T1_rec"],  rec["T1_sig"],
                   r"True $T_1$ (s)",               r"Recovered $T_1$ (s)",               "(a)"),
                  (rec["T2_true"],  rec["T2_rec"],  rec["T2_sig"],
                   r"True $T_2$ (s)",               r"Recovered $T_2$ (s)",               "(b)"),
                  (rec["dw_true"],  rec["dw_rec"],  rec["dw_sig"],
                   r"True $|\Delta\omega|$ (rad/s)", r"Recovered $|\Delta\omega|$ (rad/s)","(c)"),
                  (rec["eps_true"], rec["eps_rec"], rec["eps_sig"],
                   r"True $\varepsilon_{sx}$",       r"Recovered $\varepsilon_{sx}$",      "(d)"),
              ]
              fig = plt.figure(figsize=(7.16, 6.6))
              gs  = gridspec.GridSpec(2, 2, figure=fig, hspace=0.46, wspace=0.42,
                                      left=0.11, right=0.97, top=0.93, bottom=0.10)
              for idx, (tv, rv, sv, xl, yl, lab) in enumerate(panels):
                  ax = fig.add_subplot(gs[idx // 2, idx % 2])
                  r2_all, rmse_all = compute_metrics(tv, rv)
                  for arch in ARCHITECTURES:
                      mask = arch_arr == arch
                      if not mask.any():
                          continue
                      ax.errorbar(tv[mask], rv[mask], yerr=sv[mask],
                                  fmt=MARKERS[arch], color=COLORS[arch],
                                  markersize=3.2, linewidth=0, elinewidth=0.55,
                                  capsize=1.4, alpha=0.65, label=LABELS[arch])
                  lo = min(tv.min(), rv.min()); hi = max(tv.max(), rv.max())
                  if lo > 0:
                      lo *= 0.82; hi *= 1.22
                      ax.set_xscale("log"); ax.set_yscale("log")
                  else:
                      pad = (hi - lo) * 0.09; lo -= pad; hi += pad
                  ax.plot([lo, hi], [lo, hi], "k--", linewidth=0.9, zorder=5)
                  ax.set_xlim(lo, hi); ax.set_ylim(lo, hi)
                  ax.set_xlabel(xl, fontsize=8.5); ax.set_ylabel(yl, fontsize=8.5)
                  ax.tick_params(labelsize=7.5)
                  ax.grid(True, which="both", linewidth=0.35, alpha=0.45)
                  ax.text(0.04, 0.96, f"$R^2={r2_all:.4f}$\nRMSE$={rmse_all:.2e}$",
                          transform=ax.transAxes, fontsize=7.5, verticalalignment="top",
                          bbox=dict(boxstyle="round,pad=0.25", facecolor="white",
                                    edgecolor="#cccccc", linewidth=0.6))
                  ax.text(-0.16, 1.05, lab, transform=ax.transAxes,
                          fontsize=9.5, fontweight="bold", va="top")
              handles, leg_labels = fig.axes[0].get_legend_handles_labels()
              fig.legend(handles, leg_labels, loc="lower center", ncol=3,
                         fontsize=7.5, frameon=True, bbox_to_anchor=(0.5, 0.005),
                         handletextpad=0.4, columnspacing=0.8, framealpha=0.9,
                         edgecolor="#cccccc")
              fig.suptitle(title, fontsize=8.5, y=0.98)
              for ext in ("pdf", "png"):
                  fig.savefig(fig_dir / f"{out_stem}.{ext}", dpi=300, bbox_inches="tight")
              plt.close(fig)
              print(f"Saved {out_stem}")

          rec_p = to_arrays(parity_rows)
          make_figure(rec_p,
              "Fig. 2 — Parameter Recovery Accuracy (N=300/arch, AerSimulator, ideal Markovian)",
              "fig2_parity")

          rec_m = to_arrays(mismatch_rows)
          make_figure(rec_m,
              "Fig. 3 — Realistic Hardware Performance (N=300/arch, unmodeled physics injected)",
              "fig3_mismatch")

          print("Merge complete.")
          EOF

      - name: Upload merged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: parity-merged
          path: |
            research/data/parity_results_combined.csv
            research/data/mismatch_results_combined.csv
            research/figures/fig2_parity.pdf
            research/figures/fig2_parity.png
            research/figures/fig3_mismatch.pdf
            research/figures/fig3_mismatch.png
          retention-days: 30