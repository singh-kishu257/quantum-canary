name: Null Calibration + Non-Markovian Gradient - Parallel Matrix [all architectures]

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        arch: [superconducting, trapped_ion, neutral_atom]
        phase: ["null", "gradient"]
        prior_mode: ["arch", "live"]
        exclude:
          - phase: "gradient"
            prior_mode: "live"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install numpy scipy qiskit==2.5.1 qiskit-aer==0.17.2

      - name: Make output folders
        run: mkdir -p research/data

      - name: Run (arch=${{ matrix.arch }}, phase=${{ matrix.phase }}, prior=${{ matrix.prior_mode }})
        run: |
          cd research
          export ARCH="${{ matrix.arch }}"
          export PHASE="${{ matrix.phase }}"
          export PRIOR_MODE="${{ matrix.prior_mode }}"
          N_WORKERS=4 python 3_null_nonm.py

      - name: Upload results (always, even on timeout/failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nullnonm-${{ matrix.arch }}-${{ matrix.phase }}-${{ matrix.prior_mode }}
          path: |
            research/data/nullraw_nonm_${{ matrix.arch }}_${{ matrix.phase }}*.csv
            research/data/nullsummary_nonm_${{ matrix.arch }}_${{ matrix.phase }}*.csv
            research/data/gradraw_nonm_${{ matrix.arch }}_${{ matrix.phase }}*.csv
            research/data/gradsummary_nonm_${{ matrix.arch }}_${{ matrix.phase }}*.csv
          if-no-files-found: warn

  combine:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install numpy scipy qiskit==2.5.1 qiskit-aer==0.17.2

      - name: Make output folders
        run: mkdir -p research/data

      - name: Download all split results
        uses: actions/download-artifact@v4
        with:
          pattern: nullnonm-*
          path: research/data
          merge-multiple: true

      - name: Merge CSVs
        run: |
          cd research
          COMBINE=1 python 3_null_nonm.py

      - name: Upload final merged results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nullnonm-FINAL-merged
          path: |
            research/data/nullraw_ALL.csv
            research/data/nullsummary_ALL.csv
            research/data/gradraw_ALL.csv
            research/data/gradsummary_ALL.csv
            research/data/nullraw_live_ALL.csv
            research/data/nullsummary_live_ALL.csv
          if-no-files-found: warn