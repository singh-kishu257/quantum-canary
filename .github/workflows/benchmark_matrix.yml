name: NISQ Benchmark - Parallel Matrix

on:
  workflow_dispatch:
    inputs:
      n_instances:
        description: "Instances per architecture"
        required: false
        default: "300"

permissions:
  contents: read

concurrency:
  group: nisq-benchmark-${{ github.ref }}
  cancel-in-progress: false

env:
  N_INSTANCES: ${{ github.event.inputs.n_instances || '300' }}

jobs:
  run:
    name: ${{ matrix.architecture }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: superconducting
            seed_offset: 0
          - architecture: trapped_ion
            seed_offset: 100000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r research/requirements.txt

      - name: Self-test the simulation layer
        run: python research/1c_simulation_models.py

      - name: Run benchmark
        run: |
          python research/3_benchmark.py \
            --architecture "${{ matrix.architecture }}" \
            --n-instances "${N_INSTANCES}" \
            --seed-offset "${{ matrix.seed_offset }}" \
            --out "nisq_benchmark_${{ matrix.architecture }}.csv"

      - name: Upload architecture CSV
        uses: actions/upload-artifact@v4
        with:
          name: nisq-benchmark-${{ matrix.architecture }}
          path: nisq_benchmark_${{ matrix.architecture }}.csv
          if-no-files-found: error
          retention-days: 90

  merge:
    name: merge
    needs: run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r research/requirements.txt

      - name: Download architecture CSVs
        uses: actions/download-artifact@v4
        with:
          pattern: nisq-benchmark-*
          merge-multiple: true
          path: benchmark_inputs

      - name: Combine into nisq_benchmark.csv
        run: |
          python research/3_benchmark.py \
            --combine \
            --n-instances "${N_INSTANCES}" \
            --input benchmark_inputs/nisq_benchmark_superconducting.csv \
            --input benchmark_inputs/nisq_benchmark_trapped_ion.csv \
            --out nisq_benchmark.csv

      - name: Upload nisq_benchmark.csv
        uses: actions/upload-artifact@v4
        with:
          name: nisq-benchmark-combined
          path: nisq_benchmark.csv
          if-no-files-found: error
          retention-days: 90
