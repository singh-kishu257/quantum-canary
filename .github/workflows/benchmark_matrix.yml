name: Benchmark - Parallel Matrix [all architectures]

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        budget: [1000, 2500, 5000, 9900, 15000, 25000, 50000]
        architecture: [superconducting, trapped_ion, neutral_atom]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install qiskit==2.5.1 qiskit-aer==0.17.2 qiskit-experiments==0.14.1 qiskit-ibm-runtime
      - name: Make output folders
        run: mkdir -p research/data
      - name: Run benchmark (budget=${{ matrix.budget }}, arch=${{ matrix.architecture }})
        run: |
          cd research
          export BUDGET_SUBSET="${{ matrix.budget }}"
          export ARCH="${{ matrix.architecture }}"
          export JOB_TAG="${{ matrix.budget }}_${{ matrix.architecture }}"
          N_WORKERS=4 python 7_benchmark_experiments.py
      - name: Upload results (always, even on timeout/failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ matrix.budget }}-${{ matrix.architecture }}
          path: research/data/qe_benchmark.csv
          if-no-files-found: warn

  merge:
    name: "Merge into final CSVs"
    runs-on: ubuntu-latest
    needs: run
    if: always()
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy scipy qiskit==2.5.1 qiskit-aer==0.17.2
      - name: Make output folders
        run: mkdir -p research/data
      - name: Download all split results
        uses: actions/download-artifact@v4
        with:
          pattern: benchmark-results-*
          path: research/data
      - name: Merge into qe_benchmark.csv + qe_threshold.csv
        run: |
          cd research
          COMBINE=1 python 7_benchmark_experiments.py
      - name: Upload final merged results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qe-benchmark-FINAL
          path: |
            research/data/qe_benchmark.csv
            research/data/qe_threshold.csv
          if-no-files-found: warn