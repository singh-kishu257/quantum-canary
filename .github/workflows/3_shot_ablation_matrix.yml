name: Fig4 Shot Ablation

on:
  workflow_dispatch:

jobs:
  ablation:
    name: "${{ matrix.arch }}"
    runs-on: ubuntu-latest
    timeout-minutes: 100

    strategy:
      fail-fast: false
      matrix:
        arch:
          - superconducting
          - trapped_ion
          - neutral_atom

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install numpy scipy matplotlib qiskit qiskit-aer

      - name: Run shot ablation
        env:
          ARCH: ${{ matrix.arch }}
          N_WORKERS: "4"
        run: |
          cd research
          python 3_shot_ablation.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ablation-${{ matrix.arch }}
          path: research/data/fig4_shot_ablation_${{ matrix.arch }}.csv
          if-no-files-found: warn
          retention-days: 7

  merge:
    name: "Merge + Figure"
    runs-on: ubuntu-latest
    needs: ablation
    if: always()
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install numpy scipy matplotlib pandas qiskit qiskit-aer

      - name: Download all arch artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ablation-*
          path: research/data
          merge-multiple: true

      - name: Merge CSVs
        run: |
          python3 - << 'EOF'
          import csv, pathlib
          data_dir = pathlib.Path("research/data")
          rows = []
          for path in sorted(data_dir.glob("fig4_shot_ablation_*.csv")):
              print(f"Reading {path.name}")
              rows.extend(csv.DictReader(open(path)))
          out = data_dir / "fig4_shot_ablation.csv"
          with open(out, "w", newline="") as f:
              w = csv.DictWriter(f, fieldnames=["shots","architecture","parameter","r2"])
              w.writeheader()
              w.writerows(rows)
          print(f"Merged {len(rows)} rows -> {out}")
          EOF

      - name: Generate figure
        run: |
          cd research
          python 4_shot_analysis.py

      - name: Upload final outputs
        uses: actions/upload-artifact@v4
        with:
          name: fig4-FINAL
          path: |
            research/data/fig4_shot_ablation.csv
            research/figures/fig4_efficiency.pdf
            research/figures/fig4_efficiency.png
          retention-days: 30